name: Backup Server

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Что бэкапим"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - runtime
          - database

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_HOST:-}" ] || { echo "::error::Missing DEPLOY_HOST secret"; exit 1; }
          [ -n "${DEPLOY_USER:-}" ] || { echo "::error::Missing DEPLOY_USER secret"; exit 1; }
          [ -n "${DEPLOY_SSH_KEY:-}" ] || { echo "::error::Missing DEPLOY_SSH_KEY secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts

          candidate_ports=()
          if [ -n "${DEPLOY_PORT:-}" ]; then
            candidate_ports+=("${DEPLOY_PORT}")
          fi
          for port in 2222 22 443; do
            case " ${candidate_ports[*]:-} " in
              *" ${port} "*) ;;
              *) candidate_ports+=("${port}") ;;
            esac
          done

          resolved_port=""
          for port in "${candidate_ports[@]}"; do
            echo "Trying SSH keyscan on ${DEPLOY_HOST}:${port}"
            if ssh-keyscan -T 5 -p "${port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
              resolved_port="${port}"
              break
            fi
          done

          [ -n "${resolved_port}" ] || {
            echo "::error::Unable to fetch SSH host key from ${DEPLOY_HOST}. Tried ports: ${candidate_ports[*]}";
            exit 1;
          }

          echo "RESOLVED_DEPLOY_PORT=${resolved_port}" >> "$GITHUB_ENV"
          echo "Resolved SSH port: ${resolved_port}"

      - name: Run backup over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_PATH:-}" ] || { echo "::error::Missing DEPLOY_PATH secret"; exit 1; }
          ssh -p "${RESOLVED_DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DEPLOY_PATH}'; \
             case '${SCOPE}' in \
               runtime) bash scripts/backup_runtime.sh '${DEPLOY_PATH}' ;; \
               database) bash scripts/backup_database.sh '${DEPLOY_PATH}' ;; \
               all) bash scripts/backup_runtime.sh '${DEPLOY_PATH}'; bash scripts/backup_database.sh '${DEPLOY_PATH}' ;; \
               *) echo 'Unknown scope: ${SCOPE}' >&2; exit 1 ;; \
             esac"
